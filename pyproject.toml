[project]
name = "keptwise"
version = "1.2.1"
description = "Import your monthly bank statement, see where the money went, and know how much to invest."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jamie Baxter", email = "173777313+j-baxter2@users.noreply.github.com" }]
keywords = ["personal finance", "budgeting", "bookkeeping", "investing", "uk", "isa"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "flask>=3.0",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/indigoape/keptwise"
Issues = "https://github.com/indigoape/keptwise/issues"
Changelog = "https://github.com/indigoape/keptwise/blob/main/CHANGELOG.md"

[project.scripts]
keptwise = "keptwise.cli:app"
# The name before the rename, so existing scripts keep working.
bookkeeping = "keptwise.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/keptwise"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
